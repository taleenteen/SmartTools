<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💖 กำลังโหลด...</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' x='-0.11em' font-size='90'>😺🏷</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Sarabun', sans-serif;
            background: #0e0e12;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #9ca3af;
            overflow: hidden;
        }

        /* ═══ พื้นหลัง: ไล่ระดับสีแบบหมุนช้าๆ ═══ */
        body::before {
            content: '';
            position: fixed;
            inset: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(
                from 0deg at 50% 50%,
                #667eea22, #764ba222, #635BFF22,
                #0099FF22, #0D937322, #667eea22
            );
            animation: bgSpin 12s linear infinite;
            z-index: 0;
        }
        @keyframes bgSpin {
            to { transform: rotate(360deg); }
        }

        /* ═══ คอนเทนเนอร์หลัก ═══ */
        .loader {
            position: relative;
            z-index: 1;
            text-align: center;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ═══ ไอคอนบุ๊กมาร์กตรงกลาง ═══ */
        .center-icon {
            font-size: 44px;
            display: block;
            margin-bottom: 8px;
            animation: pulse 2s ease-in-out infinite;
            filter: drop-shadow(0 0 12px rgba(255,255,255,0.15));
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.12); }
        }

        /* ═══ คอนเทนเนอร์วงโคจร ═══ */
        .orbit-ring {
            position: relative;
            width: 160px; height: 160px;
            margin: 0 auto 20px;
        }

        /* วงกลมเส้นประวงโคจร */
        .orbit-ring::before {
            content: '';
            position: absolute;
            inset: 0;
            border: 1.5px dashed rgba(255,255,255,0.08);
            border-radius: 50%;
            animation: orbitTrack 8s linear infinite;
        }
        @keyframes orbitTrack {
            to { transform: rotate(360deg); }
        }

        /* ═══ อีโมจิธีมในวงโคจร ═══ */
        .orbit-emoji {
            position: absolute;
            font-size: 22px;
            width: 40px; height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            top: 50%; left: 50%;
            margin: -20px 0 0 -20px;
            animation: orbitMove 5s linear infinite;
            filter: drop-shadow(0 0 6px var(--glow));
        }

        .orbit-emoji:nth-child(1) { --glow: #667eea88; animation-delay:  0s;    }
        .orbit-emoji:nth-child(2) { --glow: #6E56CF88; animation-delay: -1s;    }
        .orbit-emoji:nth-child(3) { --glow: #635BFF88; animation-delay: -2s;    }
        .orbit-emoji:nth-child(4) { --glow: #0099FF88; animation-delay: -3s;    }
        .orbit-emoji:nth-child(5) { --glow: #0D937388; animation-delay: -4s;    }

        @keyframes orbitMove {
            0%   { transform: rotate(0deg)   translateX(68px) rotate(0deg)   scale(0.85); opacity: 0.65; }
            50%  { transform: rotate(180deg) translateX(68px) rotate(-180deg) scale(1.15); opacity: 1;    }
            100% { transform: rotate(360deg) translateX(68px) rotate(-360deg) scale(0.85); opacity: 0.65; }
        }

        /* ═══ แถบจุดสีระยิบระยับ ═══ */
        .color-bar {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 18px;
        }
        .color-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            animation: dotFlash 2.5s ease-in-out infinite;
        }
        .color-dot:nth-child(1) { background: #667eea; animation-delay: 0s;    }
        .color-dot:nth-child(2) { background: #6E56CF; animation-delay: 0.5s;  }
        .color-dot:nth-child(3) { background: #635BFF; animation-delay: 1s;    }
        .color-dot:nth-child(4) { background: #0099FF; animation-delay: 1.5s;  }
        .color-dot:nth-child(5) { background: #0D9373; animation-delay: 2s;    }

        @keyframes dotFlash {
            0%, 100% { transform: scale(1);   opacity: 0.3; }
            50%      { transform: scale(2.2); opacity: 1;   box-shadow: 0 0 8px currentColor; }
        }

        /* ═══ ข้อความ ═══ */
        .text {
            font-size: 13px;
            letter-spacing: 0.06em;
            color: rgba(255,255,255,0.35);
        }

        /* ═══ กรณี noscript ═══ */
        noscript .fallback {
            text-align: center;
            padding: 40px 20px;
        }
        noscript .fallback h2 {
            color: #e5e7eb;
            margin-bottom: 20px;
            font-size: 20px;
        }
        noscript .fallback a {
            display: inline-block;
            margin: 6px 8px;
            padding: 10px 22px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s, border-color 0.2s;
        }
        noscript .fallback a:hover {
            background: rgba(255,255,255,0.18);
            border-color: rgba(255,255,255,0.3);
        }
    </style>

    <!-- ★ โค้ด redirect หน้าแรก -->
<script>
(function() {
    try {
        var atMatch = (window.location.pathname || '').match(/^\/@([a-z0-9][a-z0-9_\-]{0,31})\/?$/i);
        if (atMatch) {
            window.location.replace('/u/' + atMatch[1].toLowerCase() + (window.location.search || '') + (window.location.hash || ''));
            return;
        }
    } catch(e) {}

    var theme = null;
    try {
        theme = new URLSearchParams(window.location.search).get('theme');
    } catch(e) {}

    var target = '/' + (theme ? ('?theme=' + encodeURIComponent(theme)) : '') + window.location.hash;
    window.location.replace(target);
})();
</script>
</head>
<body>

<!-- ไอคอนตรงกลาง -->
    <div class="loader" id="loader">
        <span class="center-icon">⭐️</span>

<!-- วงโคจร -->
        <div class="orbit-ring">
            <span class="orbit-emoji">🌌</span>
            <span class="orbit-emoji">📄</span>
            <span class="orbit-emoji">💎</span>
            <span class="orbit-emoji">🖤</span>
            <span class="orbit-emoji">🌿</span>
        </div>
        
<!-- แถบจุดสีระยิบระยับ -->
        <div class="color-bar">
            <span class="color-dot"></span>
            <span class="color-dot"></span>
            <span class="color-dot"></span>
            <span class="color-dot"></span>
            <span class="color-dot"></span>
        </div>

        <p class="text">กำลังโหลด…</p>
    </div>

    <noscript>
        <div class="fallback">
            <h2>⭐️ เข้าสู่ระบบ SmartTools</h2>
            <a href="/">หน้าหลัก Bookmarks</a>
        </div>
    </noscript>
</body>
</html>
