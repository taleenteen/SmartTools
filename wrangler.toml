# This Cloudflare project is a Worker (Git builds), not classic Pages.
# CI runs `npx wrangler deploy` — do not use `wrangler pages deploy`.
name = "smart-tools"
main = "./worker-build/index.js"
compatibility_date = "2026-09-08"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/u/*"]
